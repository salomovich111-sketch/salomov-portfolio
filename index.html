<style>
:root{color-scheme:dark;--bg:#0d1830;--card:#152340;--line:#27395f;--text:#eef2fa;--mute:#8f9dba;--gold:#d4af61;--gold2:#b8924a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 400px at 50% -50px,#1d3466,var(--bg) 70%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:420px;margin:0 auto;padding:40px 20px 60px}
.avatar{width:128px;height:128px;border-radius:50%;margin:0 auto;border:2px solid #3b5586;padding:5px;position:relative;background:#0f1a2f;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.avatar .img{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#2e497c,#101c36);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:56px;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;text-align:center;margin:22px 0 6px;letter-spacing:.5px}
.loc{text-align:center;color:var(--mute);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0}
.btn{display:block;text-align:center;padding:15px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn.gold{background:linear-gradient(135deg,#e6c77c,var(--gold2));color:#1b1405;border:0}
.label{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:2.5px;color:var(--mute);text-transform:uppercase;margin:30px 0 12px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
a.item{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit}
.ico{width:34px;height:34px;border-radius:10px;background:#0f1b34;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:14px}
.item small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
.item b{font-weight:600;font-size:15px;word-break:break-all}
.item .go{margin-left:auto;color:var(--mute)}
.rule{width:36px;height:1px;background:var(--gold);margin:12px auto;opacity:.7}
a.item,.btn{transition:transform .25s ease,border-color .25s ease,background .25s ease}
a.item:hover,.btn:hover{transform:translateY(-2px);border-color:#4d6ca8}
a.item:hover .go{color:var(--gold)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.avatar{box-shadow:0 0 0 6px rgba(212,175,97,.06),0 10px 30px rgba(0,0,0,.35)}
.wrap>*{animation:rise .7s ease both}
.wrap>*:nth-child(2){animation-delay:.08s}.wrap>*:nth-child(3){animation-delay:.16s}.wrap>*:nth-child(4){animation-delay:.24s}.wrap>*:nth-child(5){animation-delay:.32s}.wrap>*:nth-child(6){animation-delay:.4s}.wrap>*:nth-child(n+7){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wrap>*{animation:none}a.item,.btn{transition:none}}
.label svg{width:14px;height:14px;color:var(--gold);margin-right:-4px}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lang{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 6px;text-align:center}
.lang svg{display:block;width:56px;max-width:100%;height:auto;aspect-ratio:3/2;margin:0 auto;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.lang span{font-size:11px;color:var(--mute);letter-spacing:.5px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:36px;letter-spacing:1px}
</style>
</head>
